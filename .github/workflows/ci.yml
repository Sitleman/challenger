name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate deployment Compose
        env:
          IMAGE_REF: ghcr.io/sitleman/challenger:validation
          APP_VERSION: v1
          DATA_VOLUME: challenger-stage-data
        run: |
          export BOT_ENV_FILE="$RUNNER_TEMP/bot.env"
          touch "$BOT_ENV_FILE"
          docker compose -f deploy/compose.yml config --quiet

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Validate changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release/github.py validate-changes ${BASE_SHA:+--base "$BASE_SHA"}

  publish:
    if: github.event_name == 'push' && vars.RELEASE_ENABLED == 'true'
    needs: [test, lint, docker, release-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Allocate release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: python3 scripts/release/github.py register --image "$IMAGE"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: stage-release-${{ github.run_attempt }}
          path: release.json
          retention-days: 90

  stage:
    needs: publish
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact }}
          merge-multiple: true
      - run: python3 scripts/release/remote.py deploy stage
      - run: python3 scripts/release/github.py stage-success
      - run: python3 scripts/release/remote.py notify stage
