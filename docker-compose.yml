services:
  bot:
    build: .
    image: challenger-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/challenger.db
      ALLOWED_CHAT_IDS: "-1004391088785,-1003436893374"
      ADMIN_USER_IDS: "532029049"
    volumes:
      - challenger-data:/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  challenger-data:
    name: challenger-data
